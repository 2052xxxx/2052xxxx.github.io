<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Window</title>
  <style>
    .mywindow {
      position: relative;
      width: 400px;
      height: 300px;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .title-bar {
      background-color: #d700c1;
      color: white;
      padding: 0 8px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content {
      padding: 16px;
      background-color: #f9f9f9;
      /* height: calc(100% - 40px); */
    }
    .close-button{
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="mywindow">
    <div class="title-bar">
      <p>
        My Window 2
      </p>
      <span class="close-button">[X]</span>
    </div>
    <div class="content">
      This is the content of the 2nd window.
      <button id="button">Click here</button>
    </div>
  </div>
</body>
</html>
