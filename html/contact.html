<link rel="stylesheet" href="/css/contact.css">
<div class="contact">
    <div class="title-bar">
        <div class="text-img">
            <img src="/img/categories/contact-ico.png" alt="" srcset="">
            <span>CONTACT</span>
        </div>
        <img class="close-button" src="/img/close-button.png">
    </div>
    <div class="contact-container">
        <div class="contact-form">
            <span class="title">Send an Email</span>
            <form class="content" id="contactForm">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Your Subject..">

                <label for="body">Body</label>
                <textarea id="body" name="body" placeholder="Write something.." style="height:200px"></textarea>

                <label for="note">* click the button below to open your mail app</label>
                <input class="submit_btn" type="submit" value="mailto:">
            </form>
        </div>
        <div class="contact-info">
            <span class="title">Contact Info</span>
            <div class="content">
                <div class="item">
                    <div class="email-icon"></div>
                    <span>
                        Email
                        <span class="email-copy">
                            minhtrang.nmt02@gmail.com
                        </span>
                    </span>
                </div>
                <div class="item">
                    <div class="location-icon"></div>
                    <span>
                        Location <br>
                        Ho Chi Minh City, VN
                    </span>
                </div>
                <div class="line-break"></div>
                <div class="item">
                    Connect me through:
                    <div class="apps">
                        <a class="app-link" target="_blank" href="https://www.linkedin.com/in/minh-trang-nmt/"
                            title="https://www.linkedin.com/in/minh-trang-nmt/">
                            <img src="/img/linkedin-icon.png" alt="">
                        </a>
                        <a class="app-link" target="_blank" href="https://github.com/2052xxxx"
                            title="https://github.com/2052xxxx">
                            <img src="/img/github-icon.png" alt="">
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="inspo-collected">
            <span class="title">Inspo Collected</span>
            <div class="content">
                <a target="_blank" class="link" href="https://www.sharyap.com/">
                    sharyap website
                </a>
                <a target="_blank" class="link" href="https://pollygon.dev/">
                    pollygon dev
                </a>
                <a target="_blank" class="link" href="https://pin.it/POrVX7FMH">
                    pinterest pics & icons
                </a>
            </div>
        </div>
    </div>
</div>
<script src="/js/contact.js"></script>
