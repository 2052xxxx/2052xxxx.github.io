<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Window</title>
  <style>
    .mywindow {
      position: relative;
      width: 400px;
      height: 300px;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .title-bar {
      background-color: #0078d7;
      color: white;
      padding: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .content {
      padding: 16px;
      background-color: #f9f9f9;
      height: calc(100% - 40px);
    }
  </style>
</head>
<body>
  <div class="mywindow">
    <div class="title-bar">My Window</div>
    <div class="content">This is the content of the window.</div>
  </div>
</body>
</html>
